{% load static %}
<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>MyMental</title>
  <link rel="icon" type="image/jpg" href="{% static 'mymental/images/Mental-Health-Icon-edit-online.jpg' %}">
  <style>
    body {
      background-image: url("{% static 'mymental/images/9_yutyty_1231.jpg'%}");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      min-height: 100vh;
    }

    .navbar ul {
      list-style-type: none;
      background-color: hsl(197, 83%, 36%);
      padding: 0px;
      margin: 0px;
      overflow: hidden;
    }

    .navbar a {
      text-decoration: none;
      color: white;
      display: block;
      font-family: arial;
      font-size: 50px;
      padding: 25px;
      font-weight: bold;
    }

    .navbar li {
      float: left;
    }

    .navbar a:hover {
      background-color: hsl(197, 83%, 20%);
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      padding-left: 20px;
    }

    .footer h3 {
      display: inline-block;
      color: rgb(255, 255, 255);
      text-shadow:
        -0.7px -0.7px 0 black,
        0.7px -0.7px 0 black,
        -0.7px 0.7px 0 black,
        0.7px 0.7px 0 black;
      opacity: 0.9;
    }

    body.main-page .navbar a[href="/rating page/"] {
      background-color: hsl(197, 83%, 20%);
    }

    body.statistics-page .navbar a[href="/statistics page/"] {
      background-color: hsl(197, 83%, 20%);
    }

    body.to_do_list .navbar a[href="/to do list page/"] {
      background-color: hsl(197, 83%, 20%);
    }

    .success {
      padding: 20px;
      margin: 20px;
      display: inline-block;
      color: rgba(255, 255, 255, 0.938);
      font-family: sans-serif;
      font-size: 35px;
      background-color: rgba(51, 128, 0, 0.432);
      text-align: center;
    }

    .error {
      padding: 20px;
      margin: 20px;
      display: inline-block;
      color: rgb(231, 198, 11);
      font-family: sans-serif;
      font-size: 35px;
      background-color: rgba(185, 7, 7, 0.603);
      text-align: center;
    }
  </style>
</head>

<body class="{% block body_class %}{% endblock %}">
  <nav class='navbar'>
    <ul>
      <li><a href="{% url 'logout' %}">Logout</a></li>
      <li><a href="{% url 'rating_page' %}">Home</a></li>
      <li><a href="{% url 'statistics_page' %}">Statistics</a></li>
      <li><a href="{% url 'to_do_list' %}">To Do List</a></li>
    </ul>
  </nav>
  {% if messages %}
  {% for message in messages %}
  <span class="{{ message.tags }}">
    {{ message }}
  </span>
  {% endfor %}
  {% endif %}
  {% block content %}
  {% endblock %}
  <footer class="footer">
    <h3>made by github @panagiotisad</h3>
  </footer>
</body>

</html>
